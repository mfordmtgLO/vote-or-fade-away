name: Rename Forge file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to forge.html
        run: |
          git mv -f how-the-forge-works-power-card-character-forge.html forge.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename How the Forge Works explainer to forge.html"
          git push
