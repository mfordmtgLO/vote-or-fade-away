name: Rename game page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename vote-or-fade-away.html to index.html
        run: |
          git config user.name "mfordmtgLO"
          git config user.email "mfordmtgLO@users.noreply.github.com"
          git mv vote-or-fade-away.html index.html
          git commit -m "Rename game page to index.html"
          git push
