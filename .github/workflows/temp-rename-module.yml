name: Temp rename module

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename new build to module.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f vote-or-fade-away-game-module.html module.html
          git commit -m "Rename new DM Guide build to module.html"
          git push
