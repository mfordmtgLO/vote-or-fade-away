name: Swap to index

on:
  workflow_dispatch:

jobs:
  swap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Swap vote-or-fade-away.html to index.html
        run: |
          git mv -f vote-or-fade-away.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Swap vote-or-fade-away.html to index.html"
          git push
