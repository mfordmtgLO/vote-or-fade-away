name: del
on: workflow_dispatch
jobs:
  mv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git rm -q .github/workflows/rename.yml .github/workflows/del.yml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Remove temp workflows"
          git push
