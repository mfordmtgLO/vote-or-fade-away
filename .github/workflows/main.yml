name: Swap finale test

on:
  workflow_dispatch:

jobs:
  swap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename swap file to finale-test.html
        run: |
          git mv -f finale-test-swap33.html finale-test.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Swap finale-test.html to swap33 build"
          git push
