name: Swap finale test
on:
  workflow_dispatch:
jobs:
  swap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename swap file to finale-test.html
        run: |
          git mv -f finale-test-swap34.html finale-test.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename finale-test-swap34.html to finale-test.html"
          git push
