name: Publish module
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish vote-or-fade-away-game-module.html as module.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f vote-or-fade-away-game-module.html module.html
          git commit -m "Module: status-bar clearance + the 100/185 note"
          git push
