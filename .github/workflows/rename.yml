name: rename
on: workflow_dispatch
jobs:
  mv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git mv -f vote-or-fade-away.html index.html
          git mv -f vote-or-fade-away-game-module.html module.html
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -m "Rename uploads to index.html and module.html"
          git push
