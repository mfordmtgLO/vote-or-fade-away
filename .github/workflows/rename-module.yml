name: rename-module
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename export to module.html
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git mv -f vote-or-fade-away-game-module.html module.html
          git commit -m "Rename re-themed Guide export to module.html"
          git push
