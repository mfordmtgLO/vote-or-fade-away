name: Rename finale test
on:
  push:
    paths:
      - '.github/workflows/rename-finale-test.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move swap32 file into place
        run: |
          set -e
          ls -l finale-test-swap32.html finale-test.html
          rm -f finale-test.html
          mv finale-test-swap32.html finale-test.html
          ls -l finale-test.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finale-test.html finale-test-swap32.html
          git status --short
          git commit -m "Finale test page re-cut on swap #32 (answer randomizer)"
          git push
