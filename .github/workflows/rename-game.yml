name: rename-game
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename export to index.html
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git mv -f vote-or-fade-away.html index.html
          git commit -m "Rename swap #32 export to index.html"
          git push
